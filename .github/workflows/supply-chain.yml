name: Supply-chain images

on:
  workflow_dispatch:
  push:
    branches: [main]

# Each runner job declares only the authority required for its phase.
permissions: {}

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    name: Define the reviewed image set
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - name: Export the image matrix
        id: images
        env:
          MATRIX_JSON: >-
            {"include":[
              {"image":"xyz","context":"docker/xyz","dockerfile":"docker/xyz/Dockerfile"},
              {"image":"config-ui","context":"config-ui","dockerfile":"config-ui/Dockerfile"},
              {"image":"semantic-service","context":"semantic-service","dockerfile":"semantic-service/Dockerfile"},
              {"image":"browser-runner","context":"browser-runner","dockerfile":"browser-runner/Dockerfile"},
              {"image":"postgis-h3","context":"docker/postgis","dockerfile":"docker/postgis/Dockerfile"},
              {"image":"etl","context":"etl","dockerfile":"etl/Dockerfile"},
              {"image":"egress-proxy","context":"docker/egress-proxy","dockerfile":"docker/egress-proxy/Dockerfile"},
              {"image":"caddy","context":"docker/caddy","dockerfile":"docker/caddy/Dockerfile"}
            ]}
        run: |
          matrix="$(jq -c . <<<"$MATRIX_JSON")"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Log in to GitHub Container Registry for publishing
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the registry reference
        id: image
        env:
          COMPONENT: ${{ matrix.image }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"
          image_name="ghcr.io/${owner}/${repository}-${COMPONENT}"
          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"

      - name: Build and push the final image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record the immutable scan subject
        env:
          COMPONENT: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          mkdir -p subject
          jq -n \
            --arg component "$COMPONENT" \
            --arg digest "$IMAGE_DIGEST" \
            --arg image "$IMAGE_NAME" \
            --arg revision "$GITHUB_SHA" \
            '{component: $component, image: $image, digest: $digest, revision: $revision}' \
            > subject/subject.json

      - name: Retain the immutable scan subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subject-${{ matrix.image }}-${{ github.sha }}-${{ github.run_id }}
          path: subject/subject.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  scan:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Download the immutable scan subject
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: subject-${{ matrix.image }}-${{ github.sha }}-${{ github.run_id }}
          path: subject

      - name: Validate the immutable scan subject
        id: subject
        env:
          COMPONENT: ${{ matrix.image }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"
          expected_image="ghcr.io/${owner}/${repository}-${COMPONENT}"
          test "$(jq -er '.component' subject/subject.json)" = "$COMPONENT"
          test "$(jq -er '.image' subject/subject.json)" = "$expected_image"
          test "$(jq -er '.revision' subject/subject.json)" = "$GITHUB_SHA"
          digest="$(jq -er '.digest' subject/subject.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image-ref=%s@%s\n' "$expected_image" "$digest" >> "$GITHUB_OUTPUT"
          printf 'output-stem=%s-%s\n' "$COMPONENT" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx for provenance inspection
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Log in to GitHub Container Registry read-only
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.44.0

      - name: Generate retained SPDX and CycloneDX SBOMs
        env:
          IMAGE_REF: ${{ steps.subject.outputs.image-ref }}
          OUTPUT_STEM: ${{ steps.subject.outputs.output-stem }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p evidence
          "$SYFT" "$IMAGE_REF" \
            -o "spdx-json=evidence/${OUTPUT_STEM}.spdx.json" \
            -o "cyclonedx-json=evidence/${OUTPUT_STEM}.cyclonedx.json"

      - name: Preserve the BuildKit SLSA provenance
        env:
          IMAGE_REF: ${{ steps.subject.outputs.image-ref }}
          OUTPUT_STEM: ${{ steps.subject.outputs.output-stem }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" \
            --format '{{ json .Provenance.SLSA }}' \
            > "evidence/${OUTPUT_STEM}.provenance.json"
          jq -e 'type == "object" and length > 0' \
            "evidence/${OUTPUT_STEM}.provenance.json" > /dev/null

      - name: Scan the final image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: ${{ steps.subject.outputs.image-ref }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          format: sarif
          output: evidence/${{ steps.subject.outputs.output-stem }}.trivy.sarif
          exit-code: "1"
          timeout: 15m

      - name: Remove the registry credential
        if: always()
        run: docker logout ghcr.io

      - name: Retain scan, SBOM, and provenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.image }}-${{ github.sha }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  sign:
    needs: [plan, scan]
    name: Sign ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Download the immutable scan subject
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: subject-${{ matrix.image }}-${{ github.sha }}-${{ github.run_id }}
          path: subject

      - name: Download the scanned evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-${{ matrix.image }}-${{ github.sha }}-${{ github.run_id }}
          path: evidence

      - name: Validate the signed subject
        id: subject
        env:
          COMPONENT: ${{ matrix.image }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"
          expected_image="ghcr.io/${owner}/${repository}-${COMPONENT}"
          test "$(jq -er '.component' subject/subject.json)" = "$COMPONENT"
          test "$(jq -er '.image' subject/subject.json)" = "$expected_image"
          test "$(jq -er '.revision' subject/subject.json)" = "$GITHUB_SHA"
          digest="$(jq -er '.digest' subject/subject.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image-ref=%s@%s\n' "$expected_image" "$digest" >> "$GITHUB_OUTPUT"
          printf 'output-stem=%s-%s\n' "$COMPONENT" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p signatures
          cp subject/subject.json signatures/subject.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign the retained evidence with GitHub OIDC
        env:
          OUTPUT_STEM: ${{ steps.subject.outputs.output-stem }}
        run: |
          cosign sign-blob --yes \
            --bundle "signatures/${OUTPUT_STEM}.spdx.sigstore.json" \
            "evidence/${OUTPUT_STEM}.spdx.json"
          cosign sign-blob --yes \
            --bundle "signatures/${OUTPUT_STEM}.cyclonedx.sigstore.json" \
            "evidence/${OUTPUT_STEM}.cyclonedx.json"
          cosign sign-blob --yes \
            --bundle "signatures/${OUTPUT_STEM}.provenance.sigstore.json" \
            "evidence/${OUTPUT_STEM}.provenance.json"

      - name: Verify the retained evidence signatures
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@${{ github.ref }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          OUTPUT_STEM: ${{ steps.subject.outputs.output-stem }}
        run: |
          cosign verify-blob \
            --bundle "signatures/${OUTPUT_STEM}.spdx.sigstore.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "evidence/${OUTPUT_STEM}.spdx.json"
          cosign verify-blob \
            --bundle "signatures/${OUTPUT_STEM}.cyclonedx.sigstore.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "evidence/${OUTPUT_STEM}.cyclonedx.json"
          cosign verify-blob \
            --bundle "signatures/${OUTPUT_STEM}.provenance.sigstore.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "evidence/${OUTPUT_STEM}.provenance.json"

      - name: Retain signature bundles before signing the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures-${{ matrix.image }}-${{ github.sha }}-${{ github.run_id }}
          path: signatures/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Log in to GitHub Container Registry for signing
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the image last
        env:
          IMAGE_REF: ${{ steps.subject.outputs.image-ref }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify the image signature
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@${{ github.ref }}
          IMAGE_REF: ${{ steps.subject.outputs.image-ref }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF"

      - name: Remove the registry credential
        if: always()
        continue-on-error: true
        run: docker logout ghcr.io
