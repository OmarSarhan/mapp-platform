name: Supply-chain images

on:
  workflow_dispatch:
  push:
    branches: [main]

# Publishing and signing are deliberately isolated from pull-request workflows.
permissions: {}

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-sign:
    if: github.ref == 'refs/heads/main'
    name: Build, scan, and sign ${{ matrix.image }}
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: xyz
            context: docker/xyz
            dockerfile: docker/xyz/Dockerfile
          - image: config-ui
            context: config-ui
            dockerfile: config-ui/Dockerfile
          - image: semantic-service
            context: semantic-service
            dockerfile: semantic-service/Dockerfile
          - image: browser-runner
            context: browser-runner
            dockerfile: browser-runner/Dockerfile
          - image: postgis-h3
            context: docker/postgis
            dockerfile: docker/postgis/Dockerfile
          - image: etl
            context: etl
            dockerfile: etl/Dockerfile
          - image: egress-proxy
            context: docker/egress-proxy
            dockerfile: docker/egress-proxy/Dockerfile

    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the registry reference
        id: image
        env:
          COMPONENT: ${{ matrix.image }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"
          image_name="ghcr.io/${owner}/${repository}-${COMPONENT}"
          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"

      - name: Build and push the final image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.44.0

      - name: Generate retained SPDX and CycloneDX SBOMs
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          OUTPUT_STEM: ${{ matrix.image }}-${{ github.sha }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p evidence
          "$SYFT" "$IMAGE_REF" \
            -o "spdx-json=evidence/${OUTPUT_STEM}.spdx.json" \
            -o "cyclonedx-json=evidence/${OUTPUT_STEM}.cyclonedx.json"

      - name: Preserve the BuildKit SLSA provenance
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          OUTPUT_STEM: ${{ matrix.image }}-${{ github.sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" \
            --format '{{ json .Provenance.SLSA }}' \
            > "evidence/${OUTPUT_STEM}.provenance.json"
          jq -e 'type == "object" and length > 0' \
            "evidence/${OUTPUT_STEM}.provenance.json" > /dev/null

      - name: Scan the final image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          format: sarif
          output: evidence/${{ matrix.image }}-${{ github.sha }}.trivy.sarif
          exit-code: "1"
          timeout: 15m

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign the image and retained evidence with GitHub OIDC
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          OUTPUT_STEM: ${{ matrix.image }}-${{ github.sha }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign sign-blob --yes \
            --bundle "evidence/${OUTPUT_STEM}.spdx.sigstore.json" \
            "evidence/${OUTPUT_STEM}.spdx.json"
          cosign sign-blob --yes \
            --bundle "evidence/${OUTPUT_STEM}.cyclonedx.sigstore.json" \
            "evidence/${OUTPUT_STEM}.cyclonedx.json"
          cosign sign-blob --yes \
            --bundle "evidence/${OUTPUT_STEM}.provenance.sigstore.json" \
            "evidence/${OUTPUT_STEM}.provenance.json"

      - name: Verify the keyless signatures
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@${{ github.ref }}
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          OUTPUT_STEM: ${{ matrix.image }}-${{ github.sha }}
        run: |
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF"
          cosign verify-blob \
            --bundle "evidence/${OUTPUT_STEM}.spdx.sigstore.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "evidence/${OUTPUT_STEM}.spdx.json"
          cosign verify-blob \
            --bundle "evidence/${OUTPUT_STEM}.cyclonedx.sigstore.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "evidence/${OUTPUT_STEM}.cyclonedx.json"
          cosign verify-blob \
            --bundle "evidence/${OUTPUT_STEM}.provenance.sigstore.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "evidence/${OUTPUT_STEM}.provenance.json"

      - name: Retain scan, SBOM, signature, and provenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ matrix.image }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
