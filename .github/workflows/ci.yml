name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r config-ui/requirements.txt
          python -m pip install -e etl

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: |
            config-ui/package-lock.json
            browser-runner/package-lock.json

      - name: Test configuration service
        run: PYTHONPATH=config-ui python -m unittest discover -s config-ui/tests -v

      - name: Test ETL
        run: PYTHONPATH=etl/src python -m unittest discover -s etl/tests -v

      - name: Test semantic service
        run: PYTHONPATH=semantic-service python -m unittest discover -s semantic-service/tests -v

      - name: Build semantic service image
        run: docker build --tag mapp-semantic-service:ci semantic-service

      - name: Test deployment helpers
        run: PYTHONPATH=. python -m unittest discover -s scripts/tests -v

      - name: Test browser egress allowlist
        run: |
          docker build --tag mapp-egress-proxy:ci docker/egress-proxy
          python scripts/test_egress_proxy.py --proxy-image mapp-egress-proxy:ci

      - name: Build dashboard
        working-directory: config-ui
        run: |
          npm ci
          npm test
          npm run build
          npm audit --omit=dev

      - name: Check browser runner
        working-directory: browser-runner
        run: |
          npm ci --ignore-scripts
          node --check server.mjs
          npm audit --omit=dev

      - name: Check XYZ supervisor wrapper
        run: node --check docker/xyz/supervisor.mjs

      - name: Validate shell and Compose configuration
        env:
          SEMANTIC_INTERNAL_TOKEN: ci-only-not-a-secret-semantic-token-000000
        run: |
          bash -n bin/mapp scripts/verify.sh docker/postgis/healthcheck.sh docker/postgis/init/10-roles.sh
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.bundled-db.yaml config --quiet
          CONFIG_UID=1234 CONFIG_GID=2345 \
            docker compose --env-file .env.example -f compose.yaml -f compose.bundled-db.yaml config --format json \
            | python -c 'import json,sys; services=json.load(sys.stdin)["services"]; expected="1234:2345"; assert all(services[name]["user"] == expected for name in ("xyz","config-ui","browser-runner")); assert services["xyz"]["environment"]["DBS_MAPP"] == services["config-ui"]["environment"]["DBS_MAPP"]; assert "db" in services["xyz"]["depends_on"] and "db" in services["config-ui"]["depends_on"]'
          docker compose --env-file .env.example -f compose.yaml -f compose.bundled-db.yaml -f compose.db-port.yaml config --quiet
          DBS_MAPP='postgresql://reader:encoded@postgis.internal.example:5432/maps?sslmode=require' \
            docker compose --env-file /dev/null -f compose.yaml config --format json \
            | python -c 'import json,sys; services=json.load(sys.stdin)["services"]; expected="postgresql://reader:encoded@postgis.internal.example:5432/maps?sslmode=require"; assert services["xyz"]["environment"]["DBS_MAPP"] == expected == services["config-ui"]["environment"]["DBS_MAPP"]; assert "db" not in services and "etl" not in services; assert "db" not in services["xyz"].get("depends_on", {}); assert set(services["config-ui"].get("depends_on", {})) == {"semantic-service"}'
          export PRODUCTION_MAP_SITE=https://maps.company.co.uk
          export PRODUCTION_CONFIG_SITE=https://config.company.co.uk
          export PRODUCTION_CONFIG_ALLOWED_HOSTS=config.company.co.uk,config-ui
          export PRODUCTION_CADDY_EMAIL=operations@company.co.uk
          export EDGE_BIND_ADDRESS=0.0.0.0
          export HTTP_PORT=80
          export HTTPS_PORT=443
          python scripts/validate_production_env.py --environment .env.example
          docker compose --env-file .env.example -f compose.yaml -f compose.bundled-db.yaml -f compose.production.yaml config --quiet
          DBS_MAPP='postgresql://reader:encoded@postgis.internal.example:5432/maps?sslmode=verify-full&sslrootcert=/etc/ssl/certs/ca-certificates.crt' \
            docker compose --env-file /dev/null -f compose.yaml -f compose.production.yaml config --quiet
