# Opt-in overlay: let an external host database federate.
#
# Federation needs a role on the HOST database that can CREATE SERVER, so
# compose.yaml deliberately forwards no provisioner credential -- an external
# deployment points at a server MAPP does not administer, and silently
# attempting DDL on someone else's database is not a default worth having.
#
# This file is how an operator says they have administered it. Follow
# docs/federation-external.md first: it installs postgres_fdw, creates the
# mapp_federation role and grants it USAGE on the wrapper plus CREATE on the
# database. Then set FEDERATION_DATABASE_URL and FEDERATION_DB_USER in .env to
# that role and bring the stack up with this file added:
#
#   docker compose --project-directory . --env-file .env \
#     --file compose.yaml --file compose.federation-external.yaml up -d
#
# Nothing here proves the grants were actually run. The host capability probe
# does, from the live catalog -- GET /api/federation/aliases reports
# host.federationReady, and provisioning is refused by PostgreSQL rather than
# by MAPP guessing. Forwarding a credential that turns out to lack the grants
# is therefore safe: it fails closed and says which grant is missing.
#
# Applies to external and external-production alike; both use compose.yaml for
# config-ui's environment.
services:
  config-ui:
    environment:
      FEDERATION_DATABASE_URL: ${FEDERATION_DATABASE_URL:?Set FEDERATION_DATABASE_URL in .env}
      FEDERATION_DB_USER: ${FEDERATION_DB_USER:?Set FEDERATION_DB_USER in .env}
