name: ${COMPOSE_PROJECT_NAME:-mapp-explore}

services:
  xyz:
    image: mapp-xyz:${XYZ_IMAGE_TAG:-v4.23.4-a6f03c0}
    build: &xyz-build
      context: ./docker/xyz
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.1-bookworm-slim}
        XYZ_REF: ${XYZ_REF:-v4.23.4}
        XYZ_COMMIT: ${XYZ_COMMIT:-a6f03c07dd7aaae2e9ab04087143ee0400e15cb9}
    restart: unless-stopped
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    env_file:
      - ./instance/xyz.env
    environment:
      DBS_MAPP: ${DBS_MAPP:?Set DBS_MAPP in .env}
    expose:
      - "3000"
    volumes:
      # XYZ receives only the live workspace, public instance assets, and its
      # narrow reload mailbox. Authentication, proposals, audit logs, and
      # browser artifacts are intentionally outside its filesystem view.
      - ./var/workspace:/app/xyz/mapp-settings:ro
      - ./instance/public:/app/xyz/public/instance:ro
      - ./var/reload:/reload
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
      - backend

  xyz-preview:
    image: mapp-xyz:${XYZ_IMAGE_TAG:-v4.23.4-a6f03c0}
    # The same build as xyz, by anchor, so the two cannot drift. Not
    # redundant: without a build section compose resolves this image by
    # *pulling* it, and mapp-xyz is published nowhere. On a machine that had
    # already built xyz the pull is skipped and everything works, which is why
    # this survived until somebody ran it on a fresh one. The second build is
    # a cache hit.
    build: *xyz-build
    restart: unless-stopped
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    env_file:
      - ./instance/xyz.env
    environment:
      DBS_MAPP: ${DBS_MAPP:?Set DBS_MAPP in .env}
      WORKSPACE_FILE: /app/xyz/mapp-settings/workspace.json
      RELOAD_DIR: /preview-reload
    expose:
      - "3000"
    volumes:
      - ./var/preview:/app/xyz/mapp-settings:ro
      - ./instance/public:/app/xyz/public/instance:ro
      - ./var/preview-reload:/preview-reload
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - automation

  semantic-service:
    image: mapp-semantic-service:local
    build:
      context: ./semantic-service
    restart: unless-stopped
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    environment:
      PORT: 8080
      SEMANTIC_INTERNAL_TOKEN: ${SEMANTIC_INTERNAL_TOKEN:?Set SEMANTIC_INTERNAL_TOKEN in .env}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      # The catalog lives in the platform database, so the service needs the
      # backend network as well as the private control link to config-ui.
      - backend
      - semantic-control

  mcp-auth:
    # Opt-in. `docker compose --profile mcp up` starts the MCP surface; a plain
    # `up` leaves it dormant, which is what keeps a deployment that does not
    # want agent access from running an authorization server it never uses.
    # `./bin/mapp` passes the profile, so the developer path is unchanged.
    profiles: ["mcp"]
    image: mapp-mcp-auth:local
    build:
      context: ./mcp-auth
    restart: unless-stopped
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    environment:
      MCP_ISSUER: ${MCP_SITE:-http://localhost:8181}
      MCP_RESOURCE: ${MCP_SITE:-http://localhost:8181}/mcp
      # What an exchanged token B is for. Must differ from MCP_RESOURCE: equal
      # values would let a token A be replayed at the configuration API, and
      # the component refuses to start if they match.
      MCP_CONFIG_API_RESOURCE: ${CONFIG_SITE:-http://config.localhost}/api
      MCP_AUTH_CONTROL_PORT: 8080
      MCP_AUTH_SOCKET: /run/mapp-auth/mapp-auth.sock
      MCP_AUTH_SECURE_COOKIES: ${MCP_AUTH_SECURE_COOKIES:-}
      # authlib refuses http:// for anything but literal localhost or a
      # loopback IP, and the development origin is http://localhost:8181, so
      # every /oauth call would fail closed without this. The production
      # overlay clears it, and a test pins that it is cleared.
      AUTHLIB_INSECURE_TRANSPORT: ${AUTHLIB_INSECURE_TRANSPORT-1}
      # Its OAuth records live in the control schema. Empty in the base
      # (external-PostgreSQL) model, where there is no packaged database;
      # compose.bundled-db.yaml supplies it.
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-}
    expose:
      - "8080"
    volumes:
      # The only shared mount: the runtime directory holding the edge socket.
      # No database credentials, workspace, control state or Docker socket.
      - ./var/mcp-auth:/run/mapp-auth
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      # The internal control link, plus backend to reach the packaged database
      # where the control schema lives. Deliberately no edge network: the
      # public surface is reached solely through the Unix socket.
      - mcp-control
      - backend
    # Every credential this component reads or writes lives in the control
    # schema, so starting before the database is starting unhealthy. The
    # bundled-db overlay is what supplies `db`; in the external-PostgreSQL
    # model there is no such service and the health check is the only gate.

  mapp-mcp:
    # Opt-in. `docker compose --profile mcp up` starts the MCP surface; a plain
    # `up` leaves it dormant, which is what keeps a deployment that does not
    # want agent access from running an authorization server it never uses.
    # `./bin/mapp` passes the profile, so the developer path is unchanged.
    profiles: ["mcp"]
    image: mapp-mcp:local
    build:
      context: ./mapp-mcp
    restart: unless-stopped
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    environment:
      # The origin it serves, and the issuer it compares. Separate values
      # because the issuer is never fetched from here: this service sits on an
      # internal-only network where the public origin does not resolve, so a
      # runtime that tried to read issuer metadata would hang until its timeout.
      MCP_SITE: ${MCP_SITE:-http://localhost:8181}
      MCP_ISSUER: ${MCP_SITE:-http://localhost:8181}
      # Every live call goes here instead: the authorization component's control
      # listener, which is reachable on mcp-control and nowhere else.
      MCP_AUTH_URL: http://mcp-auth:8080
      MCP_RUNTIME_SOCKET: /run/mapp-mcp/mapp-mcp.sock
      # The configuration API, reached over the control link. Used for two
      # things: its unauthenticated identity document, which is where the
      # instance the digest binds to comes from, and the request a token B is
      # spent on.
      MCP_CONFIG_API_URL: http://config-ui:8080
      # What a token B is *for*. Must differ from MCP_SITE's resource, or a
      # token A and a token B would share an audience and either could be
      # presented where the other belongs.
      MCP_CONFIG_API_RESOURCE: ${CONFIG_SITE:-http://config.localhost}/api
      # Registered by `./bin/mapp mcp-runtime-register`, which mints it and
      # stores only its digest. This is the one service that holds the
      # plaintext, and a test pins that it reaches no other.
      MAPP_MCP_CLIENT_SECRET: ${MAPP_MCP_CLIENT_SECRET:-}
      # Quiet by default: the component answers its own errors, and uvicorn's
      # access log would record every RPC path. Raisable without a rebuild,
      # because the first thing wanted when this misbehaves is the traceback it
      # otherwise swallows.
      MCP_RUNTIME_LOG_LEVEL: ${MCP_RUNTIME_LOG_LEVEL:-warning}
    volumes:
      # The only shared mount, and the same shape mcp-auth uses: the runtime
      # directory holding the edge socket. No database credential, no workspace,
      # no control state, no Docker socket.
      - ./var/mapp-mcp:/run/mapp-mcp
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD-SHELL, "python -c \"import http.client, os, socket; c = http.client.HTTPConnection('localhost'); c.sock = socket.socket(socket.AF_UNIX); c.sock.settimeout(2); c.sock.connect(os.environ['MCP_RUNTIME_SOCKET']); c.request('GET', '/.well-known/oauth-protected-resource/mcp'); raise SystemExit(0 if c.getresponse().status == 200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      # mcp-control alone. It needs the authorization component and nothing
      # else -- no database, because it holds no credential for one and reaches
      # platform state only through authenticated API calls, and no edge,
      # because its public surface is the Unix socket Caddy proxies.
      - mcp-control
    depends_on:
      mcp-auth:
        condition: service_healthy
        restart: true

  config-ui:
    image: mapp-config-ui:local
    build:
      context: ./config-ui
    restart: unless-stopped
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    environment:
      DBS_MAPP: ${DBS_MAPP:?Set DBS_MAPP in .env}
      DERIVED_DATABASE_URL: ${DERIVED_DATABASE_URL:-}
      DERIVED_OWNER_ROLE: ${DERIVED_OWNER_ROLE:-}
      DERIVED_READER_ROLE: ${DERIVED_READER_ROLE:-}
      DERIVED_MAX_BACKGROUND_JOBS: ${DERIVED_MAX_BACKGROUND_JOBS:-2}
      # Empty in the base (external-PostgreSQL) model, which has no packaged
      # database and therefore no control schema. compose.bundled-db.yaml
      # requires it. The store treats an empty value as "unavailable" rather
      # than falling back to anything.
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-}
      # Token-B validation. The audience must be the same expression the
      # authorization component derives its MCP_CONFIG_API_RESOURCE from, or
      # the two would disagree about which audience this service accepts and
      # every exchanged token would be refused here.
      MCP_AUTH_URL: ${MCP_AUTH_URL:-http://mcp-auth:8080}
      # Read only to compose the connection details the dashboard hands an
      # operator for an agent client. Never fetched from here: this service has
      # no route to the public origin.
      MCP_SITE: ${MCP_SITE:-http://localhost:8181}
      # Where an operator reaches this dashboard. Used to compose the approval
      # link an agent hands a person, which has to be an address in *their*
      # browser -- the internal service name this container answers on is not
      # one. Same reason as MCP_SITE above: read to compose a URL, never
      # fetched from here.
      CONFIG_SITE: ${CONFIG_SITE:-http://config.localhost}
      MCP_CONFIG_API_RESOURCE: ${CONFIG_SITE:-http://config.localhost}/api
      MCP_AUTH_CLIENT_ID: ${MCP_AUTH_CLIENT_ID:-mapp-config-api}
      MCP_AUTH_CLIENT_SECRET: ${MCP_AUTH_CLIENT_SECRET:-}
      WORKSPACE_PATH: /workspace/workspace.json
      SVG_DIR: /instance-public/svg
      PLUGIN_DIR: /instance-public/plugins
      PORT: 8080
      CONTROL_DIR: /control
      WORKSPACE_SCHEMA_PATH: /app/schema/workspace.schema.json
      RELOAD_DIR: /reload
      XYZ_VERSION: ${XYZ_REF:-v4.23.4}
      XYZ_COMMIT: ${XYZ_COMMIT:-a6f03c07dd7aaae2e9ab04087143ee0400e15cb9}
      CONFIG_ALLOWED_HOSTS: ${CONFIG_ALLOWED_HOSTS:-localhost,127.0.0.1,config.localhost,config-ui}
      CONFIG_SECURE_COOKIES: ${CONFIG_SECURE_COOKIES:-false}
      BROWSER_RUNNER_URL: http://browser-runner:8080/run
      BROWSER_XYZ_URL: http://caddy:8081
      BROWSER_PREVIEW_XYZ_URL: http://xyz-preview:3000
      VISUAL_BROWSER_TIMEOUT_SECONDS: ${VISUAL_BROWSER_TIMEOUT_SECONDS:-90}
      VISUAL_BACKGROUND_TIMEOUT_SECONDS: ${VISUAL_BACKGROUND_TIMEOUT_SECONDS:-300}
      PREVIEW_WORKSPACE_PATH: /preview/workspace.json
      PREVIEW_RELOAD_DIR: /preview-reload
      SEMANTIC_SERVICE_URL: http://semantic-service:8080
      SEMANTIC_INTERNAL_TOKEN: ${SEMANTIC_INTERNAL_TOKEN:?Set SEMANTIC_INTERNAL_TOKEN in .env}
      SEMANTIC_SOURCE_ALLOWLIST: ${SEMANTIC_SOURCE_ALLOWLIST-}
      SEMANTIC_SOURCE_EXCLUSIONS: ${SEMANTIC_SOURCE_EXCLUSIONS-}
      GEMINI_APIKEY: ${GEMINI_APIKEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    volumes:
      # The workspace directory is writable so atomic rename remains possible.
      # Public SVGs and the schema are read-only; sensitive control state is
      # isolated from both XYZ and the public asset tree.
      - ./var/workspace:/workspace
      - ./instance/public:/instance-public:ro
      - ./var/control:/control
      - ./var/reload:/reload
      - ./var/preview:/preview
      - ./var/preview-reload:/preview-reload
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - edge
      - automation
      - semantic-control
      # Reaches the authorization component's internal endpoints. Deliberately
      # no depends_on: ci.yml asserts config-ui depends only on
      # semantic-service, and the token-B path fails closed if mcp-auth is down.
      - mcp-control
    depends_on:
      semantic-service:
        condition: service_healthy
        restart: true

  caddy:
    image: mapp-caddy:2.11.4
    build:
      context: ./docker/caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443/udp"
      # The MCP origin. Its own port rather than a *.localhost name,
      # because an MCP client will not send credentials to an http
      # token endpoint on anything but a literal loopback host.
      #
      # The same number on both sides, and it has to be: Caddy listens on
      # whatever port MCP_SITE names, so a mapping onto a fixed container
      # port would publish a port nothing was listening on the moment
      # anyone changed MCP_SITE. A test pins MCP_PORT against MCP_SITE.
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8181}:${MCP_PORT:-8181}"
    environment:
      MAP_SITE: ${MAP_SITE:-http://localhost}
      CONFIG_SITE: ${CONFIG_SITE:-http://config.localhost}
      MCP_SITE: ${MCP_SITE:-http://localhost:8181}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.invalid}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./var/mcp-auth:/run/mapp-auth
      - ./var/mapp-mcp:/run/mapp-mcp
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      xyz:
        condition: service_healthy
        restart: true
      config-ui:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - automation

  browser-runner:
    image: mapp-browser-runner:local
    build:
      context: ./browser-runner
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    restart: unless-stopped
    working_dir: /runner
    environment:
      PORT: 8080
      ARTIFACT_DIR: /artifacts
      ALLOWED_ORIGIN: http://caddy:8081
      ALLOWED_ORIGINS: http://caddy:8081,http://xyz-preview:3000
      MAX_CONCURRENT_RUNS: ${BROWSER_MAX_CONCURRENT_RUNS:-1}
      VISUAL_RUN_TIMEOUT_MS: ${VISUAL_RUN_TIMEOUT_MS:-90000}
      BROWSER_PROXY_SERVER: http://egress-proxy:3128
      BROWSER_PROXY_BYPASS: caddy,xyz-preview,localhost,127.0.0.1
    volumes:
      - ./var/control/artifacts:/artifacts
    expose:
      - "8080"
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    depends_on:
      egress-proxy:
        condition: service_healthy
        restart: true
    networks:
      - automation

  egress-proxy:
    image: mapp-egress-proxy:local
    build:
      context: ./docker/egress-proxy
    init: true
    user: "13:13"
    entrypoint: [/usr/sbin/squid]
    command: [-f, /etc/squid/squid.conf, -NYC]
    restart: unless-stopped
    read_only: true
    volumes:
      - ./docker/egress-proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./instance/browser-egress-allowlist.txt:/etc/squid/browser-egress-allowlist.txt:ro
    tmpfs:
      - /run:size=1m,mode=0755,uid=13,gid=13
      - /tmp:size=8m,mode=1777
      - /var/log/squid:size=8m,mode=0750,uid=13,gid=13
      - /var/spool/squid:size=8m,mode=0750,uid=13,gid=13
    expose:
      - "3128"
    healthcheck:
      test: [CMD-SHELL, "squid -k check >/dev/null 2>&1 && pidof squid >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - automation
      - browser-egress

volumes:
  caddy_data:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_caddy_data
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_caddy_config

networks:
  edge:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_edge
  backend:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_backend
  automation:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_automation
    internal: true
  browser-egress:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_browser-egress
  semantic-control:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_semantic-control
    internal: true
  mcp-control:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_mcp-control
    internal: true
