name: ${COMPOSE_PROJECT_NAME:-mapp-explore}

services:
  xyz:
    image: mapp-xyz:${XYZ_IMAGE_TAG:-v4.23.4-a6f03c0}
    build:
      context: ./docker/xyz
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.1-bookworm-slim}
        XYZ_REF: ${XYZ_REF:-v4.23.4}
        XYZ_COMMIT: ${XYZ_COMMIT:-a6f03c07dd7aaae2e9ab04087143ee0400e15cb9}
    restart: unless-stopped
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    env_file:
      - ./instance/xyz.env
    environment:
      DBS_MAPP: ${DBS_MAPP:?Set DBS_MAPP in .env}
    expose:
      - "3000"
    volumes:
      # XYZ receives only the live workspace, public instance assets, and its
      # narrow reload mailbox. Authentication, proposals, audit logs, and
      # browser artifacts are intentionally outside its filesystem view.
      - ./var/workspace:/app/xyz/mapp-settings:ro
      - ./instance/public:/app/xyz/public/instance:ro
      - ./var/reload:/reload
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
      - backend

  xyz-preview:
    image: mapp-xyz:${XYZ_IMAGE_TAG:-v4.23.4-a6f03c0}
    restart: unless-stopped
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    env_file:
      - ./instance/xyz.env
    environment:
      DBS_MAPP: ${DBS_MAPP:?Set DBS_MAPP in .env}
      WORKSPACE_FILE: /app/xyz/mapp-settings/workspace.json
      RELOAD_DIR: /preview-reload
    expose:
      - "3000"
    volumes:
      - ./var/preview:/app/xyz/mapp-settings:ro
      - ./instance/public:/app/xyz/public/instance:ro
      - ./var/preview-reload:/preview-reload
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - automation

  semantic-service:
    image: mapp-semantic-service:local
    build:
      context: ./semantic-service
    restart: unless-stopped
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    environment:
      PORT: 8080
      STATE_DIR: /state
      SEMANTIC_INTERNAL_TOKEN: ${SEMANTIC_INTERNAL_TOKEN:?Set SEMANTIC_INTERNAL_TOKEN in .env}
    expose:
      - "8080"
    volumes:
      - ./var/semantic:/state
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - semantic-control

  config-ui:
    image: mapp-config-ui:local
    build:
      context: ./config-ui
    restart: unless-stopped
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    environment:
      DBS_MAPP: ${DBS_MAPP:?Set DBS_MAPP in .env}
      DERIVED_DATABASE_URL: ${DERIVED_DATABASE_URL:-}
      DERIVED_READER_ROLE: ${DERIVED_READER_ROLE:-}
      DERIVED_MAX_BACKGROUND_JOBS: ${DERIVED_MAX_BACKGROUND_JOBS:-1}
      WORKSPACE_PATH: /workspace/workspace.json
      SVG_DIR: /instance-public/svg
      PLUGIN_DIR: /instance-public/plugins
      PORT: 8080
      CONTROL_DIR: /control
      WORKSPACE_SCHEMA_PATH: /app/schema/workspace.schema.json
      RELOAD_DIR: /reload
      XYZ_VERSION: ${XYZ_REF:-v4.23.4}
      XYZ_COMMIT: ${XYZ_COMMIT:-a6f03c07dd7aaae2e9ab04087143ee0400e15cb9}
      CONFIG_ALLOWED_HOSTS: ${CONFIG_ALLOWED_HOSTS:-localhost,127.0.0.1,config.localhost,config-ui}
      CONFIG_SECURE_COOKIES: ${CONFIG_SECURE_COOKIES:-false}
      BROWSER_RUNNER_URL: http://browser-runner:8080/run
      BROWSER_XYZ_URL: http://caddy:8081
      BROWSER_PREVIEW_XYZ_URL: http://xyz-preview:3000
      VISUAL_BROWSER_TIMEOUT_SECONDS: ${VISUAL_BROWSER_TIMEOUT_SECONDS:-90}
      VISUAL_BACKGROUND_TIMEOUT_SECONDS: ${VISUAL_BACKGROUND_TIMEOUT_SECONDS:-300}
      PREVIEW_WORKSPACE_PATH: /preview/workspace.json
      PREVIEW_RELOAD_DIR: /preview-reload
      SEMANTIC_SERVICE_URL: http://semantic-service:8080
      SEMANTIC_INTERNAL_TOKEN: ${SEMANTIC_INTERNAL_TOKEN:?Set SEMANTIC_INTERNAL_TOKEN in .env}
      SEMANTIC_SOURCE_ALLOWLIST: ${SEMANTIC_SOURCE_ALLOWLIST-MAPP:leeds.*}
      SEMANTIC_SOURCE_EXCLUSIONS: ${SEMANTIC_SOURCE_EXCLUSIONS-}
      GEMINI_APIKEY: ${GEMINI_APIKEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    volumes:
      # The workspace directory is writable so atomic rename remains possible.
      # Public SVGs and the schema are read-only; sensitive control state is
      # isolated from both XYZ and the public asset tree.
      - ./var/workspace:/workspace
      - ./instance/public:/instance-public:ro
      - ./var/control:/control
      - ./var/reload:/reload
      - ./var/preview:/preview
      - ./var/preview-reload:/preview-reload
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - edge
      - automation
      - semantic-control
    depends_on:
      semantic-service:
        condition: service_healthy
        restart: true

  caddy:
    image: mapp-caddy:2.11.4
    build:
      context: ./docker/caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3000}:80"
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-3443}:443"
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-3443}:443/udp"
    environment:
      MAP_SITE: ${MAP_SITE:-http://localhost}
      CONFIG_SITE: ${CONFIG_SITE:-http://config.localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.invalid}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      xyz:
        condition: service_healthy
        restart: true
      config-ui:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - automation

  browser-runner:
    image: mapp-browser-runner:local
    build:
      context: ./browser-runner
    init: true
    user: "${CONFIG_UID:-1000}:${CONFIG_GID:-1000}"
    restart: unless-stopped
    working_dir: /runner
    environment:
      PORT: 8080
      ARTIFACT_DIR: /artifacts
      ALLOWED_ORIGIN: http://caddy:8081
      ALLOWED_ORIGINS: http://caddy:8081,http://xyz-preview:3000
      MAX_CONCURRENT_RUNS: ${BROWSER_MAX_CONCURRENT_RUNS:-1}
      VISUAL_RUN_TIMEOUT_MS: ${VISUAL_RUN_TIMEOUT_MS:-90000}
      BROWSER_PROXY_SERVER: http://egress-proxy:3128
      BROWSER_PROXY_BYPASS: caddy,xyz-preview,localhost,127.0.0.1
    volumes:
      - ./var/control/artifacts:/artifacts
    expose:
      - "8080"
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    depends_on:
      egress-proxy:
        condition: service_healthy
        restart: true
    networks:
      - automation

  egress-proxy:
    image: mapp-egress-proxy:local
    build:
      context: ./docker/egress-proxy
    init: true
    user: "13:13"
    entrypoint: [/usr/sbin/squid]
    command: [-f, /etc/squid/squid.conf, -NYC]
    restart: unless-stopped
    read_only: true
    volumes:
      - ./docker/egress-proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./instance/browser-egress-allowlist.txt:/etc/squid/browser-egress-allowlist.txt:ro
    tmpfs:
      - /run:size=1m,mode=0755,uid=13,gid=13
      - /tmp:size=8m,mode=1777
      - /var/log/squid:size=8m,mode=0750,uid=13,gid=13
      - /var/spool/squid:size=8m,mode=0750,uid=13,gid=13
    expose:
      - "3128"
    healthcheck:
      test: [CMD-SHELL, "squid -k check >/dev/null 2>&1 && pidof squid >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - automation
      - browser-egress

volumes:
  caddy_data:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_caddy_data
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_caddy_config

networks:
  edge:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_edge
  backend:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_backend
  automation:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_automation
    internal: true
  browser-egress:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_browser-egress
  semantic-control:
    name: ${COMPOSE_PROJECT_NAME:-mapp-explore}_semantic-control
    internal: true
