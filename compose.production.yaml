# Production hardening overlay:
# set MAPP_ENVIRONMENT=production in .env, then run ./bin/mapp serve
services:
  config-ui:
    environment:
      CONFIG_ALLOWED_HOSTS: ${PRODUCTION_CONFIG_ALLOWED_HOSTS:?Set PRODUCTION_CONFIG_ALLOWED_HOSTS to the configuration hostname}
      CONFIG_SECURE_COOKIES: "true"
      # The same override mcp-auth gets below, and it must be the same value:
      # the configuration API compares a token B's audience against this on
      # every introspection. Overriding one and not the other made every
      # exchanged credential refused in production and nowhere else, with
      # nothing in the response to say why.
      MCP_CONFIG_API_RESOURCE: ${PRODUCTION_CONFIG_SITE:?Set PRODUCTION_CONFIG_SITE to the public HTTPS configuration origin}/api

  caddy:
    environment:
      MAP_SITE: ${PRODUCTION_MAP_SITE:?Set PRODUCTION_MAP_SITE to the public HTTPS map origin}
      CONFIG_SITE: ${PRODUCTION_CONFIG_SITE:?Set PRODUCTION_CONFIG_SITE to the public HTTPS configuration origin}
      CADDY_EMAIL: ${PRODUCTION_CADDY_EMAIL:?Set PRODUCTION_CADDY_EMAIL for certificate notifications}
      MCP_SITE: ${PRODUCTION_MCP_SITE:?Set PRODUCTION_MCP_SITE to the public HTTPS MCP origin}

  mcp-auth:
    environment:
      MCP_ISSUER: ${PRODUCTION_MCP_SITE:?Set PRODUCTION_MCP_SITE to the public HTTPS MCP origin}
      MCP_RESOURCE: ${PRODUCTION_MCP_SITE:?Set PRODUCTION_MCP_SITE to the public HTTPS MCP origin}/mcp
      MCP_CONFIG_API_RESOURCE: ${PRODUCTION_CONFIG_SITE:?Set PRODUCTION_CONFIG_SITE to the public HTTPS configuration origin}/api
      MCP_AUTH_SECURE_COOKIES: "true"
      # Cleared, not absent: authlib reads truthiness, and an https origin
      # needs no escape hatch. Leaving it set in production would accept a
      # plain-http issuer.
      AUTHLIB_INSECURE_TRANSPORT: ""

  mapp-mcp:
    environment:
      # The same origin the authorization component issues for, and the same
      # one it names as the resource. If these three ever disagreed a client
      # would discover one identity and be handed a token for another, which
      # presents as an audience refusal with nothing to say where it came from.
      MCP_SITE: ${PRODUCTION_MCP_SITE:?Set PRODUCTION_MCP_SITE to the public HTTPS MCP origin}
      MCP_ISSUER: ${PRODUCTION_MCP_SITE:?Set PRODUCTION_MCP_SITE to the public HTTPS MCP origin}
