# Browser assets are denied unless their destination hostname is reviewed here.
# -n prevents an IP-form request from triggering a reverse-DNS lookup while
# checking the hostname allowlist.
acl allowed_destinations dstdomain -n "/etc/squid/browser-egress-allowlist.txt"

# Reject local, private, link-local, documentation, multicast, and reserved
# destinations even if a hostname is accidentally or maliciously allowlisted.
acl blocked_destinations dst 0.0.0.0/8
acl blocked_destinations dst 10.0.0.0/8
acl blocked_destinations dst 100.64.0.0/10
acl blocked_destinations dst 127.0.0.0/8
acl blocked_destinations dst 169.254.0.0/16
acl blocked_destinations dst 172.16.0.0/12
acl blocked_destinations dst 192.0.0.0/24
acl blocked_destinations dst 192.0.2.0/24
acl blocked_destinations dst 192.168.0.0/16
acl blocked_destinations dst 198.18.0.0/15
acl blocked_destinations dst 198.51.100.0/24
acl blocked_destinations dst 203.0.113.0/24
acl blocked_destinations dst 224.0.0.0/4
acl blocked_destinations dst 240.0.0.0/4
acl blocked_destinations dst ::/128
acl blocked_destinations dst ::1/128
acl blocked_destinations dst 100::/64
acl blocked_destinations dst 2001:db8::/32
acl blocked_destinations dst fc00::/7
acl blocked_destinations dst fe80::/10
acl blocked_destinations dst ff00::/8

acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# Browser egress is HTTPS-only. Reject unlisted CONNECT hostnames before the
# slow destination-IP ACL can resolve them, then reject reviewed names that
# resolve to private or reserved space.
http_access deny !CONNECT
http_access deny !allowed_destinations
http_access deny blocked_destinations
http_access allow CONNECT allowed_destinations
http_access deny all

http_port 3128
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
pid_filename /run/squid.pid
coredump_dir /tmp
forwarded_for delete
access_log none
cache_log /dev/stderr
cache_store_log none
visible_hostname mapp-egress-proxy
shutdown_lifetime 1 seconds
