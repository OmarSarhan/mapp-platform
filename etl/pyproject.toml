[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leeds-arcgis-etl"
version = "0.1.0"
description = "Reviewed Leeds and England Census geospatial loaders for bundled PostGIS"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]==3.3.4",
]

[tool.setuptools.packages.find]
where = ["src"]
