[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leeds-arcgis-etl"
version = "0.1.0"
description = "Small, idempotent ArcGIS REST to PostGIS loader for selected Leeds datasets"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]==3.3.4",
]

[tool.setuptools.packages.find]
where = ["src"]
